services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres_lab
      POSTGRES_USER: postgres_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_lab -d postgres_lab"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_performance_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_performance_data:
