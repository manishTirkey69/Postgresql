services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queue_lab
      POSTGRES_USER: queue_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_lab -d queue_lab"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_queue_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_queue_data:
