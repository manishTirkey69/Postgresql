<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PostgreSQL events with SSE</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f3f6fb; }
      body { max-width: 760px; margin: 0 auto; padding: 2rem 1rem; }
      main { background: white; border: 1px solid #dce3ee; border-radius: 14px; padding: 1.5rem; }
      form { display: flex; gap: .6rem; }
      input, button { font: inherit; padding: .65rem .8rem; border-radius: 8px; border: 1px solid #b8c4d6; }
      input { flex: 1; min-width: 150px; }
      button { background: #175cd3; color: white; border: 0; cursor: pointer; }
      #status { color: #526078; }
      li { padding: .4rem 0; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>Live job updates</h1>
      <p id="status" role="status">Connecting to the event stream…</p>
      <form id="job-form">
        <input id="title" maxlength="200" placeholder="Job title" required />
        <button type="submit">Create job</button>
      </form>
      <ul id="jobs"></ul>
    </main>
    <script>
      const status = document.querySelector("#status");
      const jobs = document.querySelector("#jobs");
      const eventSource = new EventSource("/events");
      const renderedEventIds = new Set();

      eventSource.onopen = () => { status.textContent = "Connected — waiting for events."; };
      eventSource.onerror = () => { status.textContent = "Connection interrupted; EventSource will reconnect."; };
      eventSource.addEventListener("job_created", (event) => {
        if (renderedEventIds.has(event.lastEventId)) return;
        renderedEventIds.add(event.lastEventId);
        const job = JSON.parse(event.data);
        const item = document.createElement("li");
        item.textContent = `${job.id}: ${job.title} (${job.created_at})`;
        jobs.prepend(item);
      });
      document.querySelector("#job-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = document.querySelector("#title");
        status.textContent = "Creating job…";
        try {
          const response = await fetch("/jobs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: input.value }),
          });
          if (!response.ok) {
            const body = await response.json();
            throw new Error(body.detail ?? `HTTP ${response.status}`);
          }
          input.value = "";
          status.textContent = "Job created; waiting for PostgreSQL notification.";
        } catch (error) {
          status.textContent = `Could not create job: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
